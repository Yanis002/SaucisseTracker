name: Build (Linux/Windows/Mac)

on:
  push:
  pull_request:
  release:
    types:
      - created
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            BUILD_NAME: SaucisseTracker_Windows
            BUILD_ARGS: -F -w --add-data "res;res" -i "res/icon.png" src/main.py
            CMD_EXEC: PyInstaller
            FILE_TYPE: ".exe"

          - os: ubuntu-latest
            BUILD_NAME: SaucisseTracker_Linux
            BUILD_ARGS: -F -w --add-data "res:res" src/main.py
            CMD_EXEC: pyinstaller
            FILE_TYPE: ""

          - os: macos-latest
            BUILD_NAME: SaucisseTracker_Mac
            BUILD_ARGS: -F -w --add-data "res:res" -i "res/icon.png" src/main.py
            CMD_EXEC: pyinstaller
            FILE_TYPE: ".app"
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Project for ${{ matrix.os }}
        run: ${{ matrix.CMD_EXEC }} ${{ matrix.BUILD_ARGS }} -n ${{ matrix.BUILD_NAME }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.BUILD_NAME }}
          path: dist/${{ matrix.BUILD_NAME }}${{ matrix.FILE_TYPE }}

      - name: Upload dev rolling release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/workflow'
        with:
          name: 'Rolling pre-release'
          body: Experimental pre-release built from latest commit on `dev` branch. Check the commit history for more details.
          target_commitish: workflow
          tag_name: 'rolling_pre-release'
          prerelease: true
          files: dist/${{ matrix.BUILD_NAME }}${{ matrix.FILE_TYPE }}
        continue-on-error: true
