line-length = 125
indent-width = 4
target-version = "py310" # minimal compatible version

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = []

exclude = [
    "src/livesplit_core.py",
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

exclude = [
    "src/livesplit_core.py",
]
